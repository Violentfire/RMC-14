  name: Медаль за Визначні Заслуги
  description: Бронзова медаль, яка видається за визначні заслуги. Хоча це й велика честь, але це й найпростіша з іменних медалей в КМПОН.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/bronze.rsi
    state: icon_co
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/bronze.rsi
      state: equipped_co

- type: entity
  parent: RMCMedalBronze
