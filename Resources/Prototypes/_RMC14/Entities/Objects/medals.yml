  name: Медаль «Бронзове Серце»
  description: Бронзова медаль у формі серця, яка видається за самопожертву на благо КМПОН. Часто вручається посмертно або за тяжке поранення, отримане під час виконання службових обов'язків.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/bronze_heart.rsi
    state: bronze_heart
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/bronze_heart.rsi
      state: equipped

- type: entity
  parent: RMCMedalBronze
  id: RMCMedalBronzeService
  name: бронзова медаль за службу
  description: Бронзова медаль, якою нагороджують за службу в КМПОН. Це найпоширеніша версія медалі за службу й найперша, яку отримує морський піхотинець.

- type: entity
  parent: RMCMedalBase
  id: RMCMedalSilver
  name: срібна медаль
  description: Срібна медаль.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/silver.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/silver.rsi
      state: equipped

- type: entity
  parent: RMCMedalSilver
  id: RMCMedalSilverValor
  name: Медаль за Доблесть
  description: Срібна медаль, яка видається за виняткову доблесть під час служби в рядах КМПОН. Зазвичай вручається тим, хто виділяється з-поміж інших, будь-то лідерськьими якостями чи визначними діями на успіх операції.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/silver.rsi
    state: icon_co
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/silver.rsi
      state: equipped_co

- type: entity
  parent: RMCMedalSilver
  id: RMCMedalSilverService
  name: срібна медаль за службу
  description: Блискуча срібна медаль, якою нагороджують за службу в КМПОН. Це доволі поширена медаль, яка вказує на вже не таку й малу кількість часу проведеного морським піхотинцем в лавах КМПОН.

- type: entity
  parent: RMCMedalBase
  id: RMCMedalGold
  name: золота медаль
  description: Золота медаль, але без золота.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/gold.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/gold.rsi
      state: equipped

- type: entity
  parent: RMCMedalGold
  id: RMCMedalGoldExceptionalHeroism
  name: Медаль за Винятковий Героїзм
  description: Надзвичайно рідкісна золота медаль, яка вручається в справді особливих випадках при службі в силах КМПОН. Отримати таку медаль – найвища честь та їх кількість налічується десятками по всьому світу.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/gold.rsi
    state: icon_co
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/gold.rsi
      state: equipped_co

- type: entity
  parent: RMCMedalGold
  id: RMCMedalHighCommandHonor
  name: Почесна Медаль Верховного Командування КМПОН
  description: Золота медаль у формі зірки, яка вручається виключно Верховним Командуванням КМПОН. Вона не заробляється лише за просту доблесть чи героїзм, а надається командуванням за вчинки, що перевершують будь-які очікування чи навіть людські можливості. Як найвища нагорода Об'єднаних Націй, вона затьмарює всі інші нагороди. Імена її лауреатів записані в історію, а не в таблиці статистики.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/gold_star.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/gold_star.rsi
      state: equipped_co

- type: entity
  parent: RMCMedalGold
  id: RMCMedalGoldService
  name: золота медаль за службу
  description: Престижна медаль з домішками золота, якою нагороджують за службу в КМПОН. Це досить рідкісна медаль, яка видається тим, кого можна назвати свого роду ветеранам.

- type: entity
  parent: RMCMedalBase
  id: RMCMedalPlatinum
  name: платинова медаль
  description: ДУЖЕ престижна медаль, що може бути вручена лиш Генералом чи кимось таким ж важливим й лише за особливі заслуги.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/platinum.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/platinum.rsi
      state: equipped

- type: entity
  parent: RMCMedalPlatinum
  id: RMCMedalPlatinumService
  name: платинова медаль за службу
  description: ДУЖЕ престижна медаль, якою нагороджують за службу в КМПОН. Справді рідкісна медаль, яка видається тим, хто ймовірно вже віддав своє життя та найкращі роки заради служби.

- type: entity
  parent: RMCMedalBase
  id: RMCMedalRuby
  name: рубінова медаль
  description: Особлива рубінова медаль, яку можуть вручати лише Генерали за особливих обставин.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/ruby.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/ruby.rsi
      state: equipped

- type: entity
  parent: RMCMedalRuby
  id: RMCMedalRubyService
  name: рубінова медаль за службу
  description: Медаль темно-малинового кольору, якою нагороджують за довгу службу в КМПОН. Дуже рідкісна медаль, яки видається тим, хто віддав себе всього якійсь одній посаді.

- type: entity
  parent: RMCMedalBase
  id: RMCMedalAmethyst
  name: аметистова медаль
  description: Міфічна аметистова медаль, яку може вручати Верховне Командування за особливих обставин.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/amethyst.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/amethyst.rsi
      state: equipped

- type: entity
  parent: RMCMedalAmethyst
  id: RMCMedalAmethystService
  name: аметистова медаль за службу
  description: Медаль блідо-фіолетового кольору, якою нагороджують за справді довгу службу в КМПОН. Одна з найрідкісніших медалей, яка вже робить з людини символ посади, яку вона займає.

- type: entity
  parent: RMCMedalBase
  id: RMCMedalEmerald
  name: смарагдова медаль
  description: Шанована смарагдова медаль, яку може вручати Верховне Командування лише за особливо особливих обставин.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/emerald.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/emerald.rsi
      state: equipped

- type: entity
  parent: RMCMedalEmerald
  id: RMCMedalEmeraldService
  name: смарагдова медаль за службу
  description: Яскрава смарагдова медаль, якою нагороджують за справді дуже довгу службу в КМПОН. Друга за рідкістю медаль, яка видається тим, кого вже нічим не здивувати та вони є експертами та найкращими знавцями своєї сфери.

- type: entity
  parent: RMCMedalBase
  id: RMCMedalPrismatic
  name: призматична медаль
  description: Міфічна призматична медаль, яку може вручати Верховне Командування лише за особливо-особливо особливих обставин.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medals/prismatic.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Medals/prismatic.rsi
      state: equipped

- type: entity
  parent: RMCMedalPrismatic
  id: RMCMedalPrismaticService
  name: призматична медаль за службу
  description: Різнокольорова призматична медаль, якою нагороджують за певно вічну службу в КМПОН. Найрідкісніша медаль всього Корпусу. Це остання з можливих медалей за службу та зазвичай її отримують ті, хто вже виходять на пенсію з кількістю років в лавах КМПОН більшою за вік рядових.

