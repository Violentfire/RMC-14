# LAWS
- type: entity
  parent: RMCGuidebookBase
  id: RMCGuidebookLawMarine
  name: Морське Право
  description: "Зазвичай найулюбленіша книга кожного офіцера Військової Служби Правоворядку КМПОН, її сенс, це бути терезами меча правосуддя, який дивиться за кожним кораблем Корпусу Морськох Піхоти Об'єднаних Націй, задля підтримки миру та порядку. Її прізвиська можуть включати, але не обмежуються: Червона книга диявола, Біблія всіх грішників, ТА книга, МП, Червона цегла, Посібник з тортур Провоста, Біблія тортур Червоного диявола всіх грішників Провоста."
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/Books/Other/marine_law.rsi
  - type: GuideHelp
    guides:
    - RMCMarineLaw

- type: entity
  parent: RMCGuidebookLawMarine
  id: RMCGuidebookLawMarineProvost
  name: "Морське Право: лімітована едиція провосту"
  suffix: Guidebook, Admeme
  components:
  - type: RMCStaminaDamageOnHit
    damage: 100
  - type: MeleeRequiresSkill
    skills:
      RMCSkillPolice: 1
  - type: StunOnHit
    whitelist:
      components:
      - Marine
  - type: StaminaDamageOnHit
    damage: 35
    sound: /Audio/Weapons/egloves.ogg
  - type: StaminaDamageOnCollide
    damage: 35
    sound: /Audio/Weapons/egloves.ogg
  - type: LandAtCursor
  - type: UseDelay
  - type: DisarmMalus
    malus: 0.225

# SOP
- type: entity
  parent: RMCGuidebookBase
  id: RMCGuidebookSOP
  name: стандартні операційні процедури
  description: Одна з найважливіших книг на борту будь-якого судна Корпусу Морської Піхоти Об’єднаних Націй, або принаймні так вам повинно здаватися. Книга містить у своїх сторінках настанови та процедури КМПОН щодо всіх видів ситуацій.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/Books/Other/SOP.rsi
  - type: GuideHelp
    guides:
    - RMCMarineSOP
