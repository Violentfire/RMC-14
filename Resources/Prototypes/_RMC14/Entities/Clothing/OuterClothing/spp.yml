# SPP armors
- type: entity
  parent: CMArmorM3Medium
  id: RMCArmorSPP
  name: броня зразка УМ5
  description: Стандартна броня військ СПН, УМ5 (Унійна Мірна Марк 5) – це середня броня, приблизно рівна за характеристиками броні зразка M3, що використовується у КМПОН, спеціалізована на захисті від куль. На відміну від М3, ця броня має важчу шийну вставку, через що багато солдатів та морпіхів ОН жартома називають солдатів СПН 'відролюдами'.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/spp.rsi
  - type: CMArmor
    bullet: 30 # CLOTHING_ARMOR_HIGH
    bio: 15 # CLOTHING_ARMOR_MEDIUMLOW
    explosionArmor: 20 # CLOTHING_ARMOR_MEDIUM
  - type: RMCArmorSpeedTier
    speedTier: medium
  - type: ClothingSpeedModifier # SLOWDOWN_ARMOR_MEDIUM
    walkModifier: 0.666
    sprintModifier: 0.666
  - type: Storage
    grid:
    - 0,0,1,1 # 1 slot
  - type: ItemCamouflage
    camouflageVariations: { }
  - type: ClothingRequireEquipped
    autoUnequip: true
    denyReason: rmc-armor-not-spp-jumpsuit
    whitelist:
      tags:
      - RMCUniformSPP

- type: entity
  parent: RMCArmorSPP
  id: RMCArmorSPPRifleman
  suffix: Filled, Rifleman
  components:
  - type: StorageFill
    contents:
    - id: RMCBinoculars

- type: entity
  parent: RMCArmorSPP
  id: RMCArmorSPPSupport
  name: броня зразка УЛ6
  description: Стандартна броня військ СПН, УЛ (Унійний Легкий Марк 6), — це легка броня, трохи слабша за броню зразка М3, що використовується у КМПОН, спеціалізована на балістичному захисті. Цей комплект персональної броні позбавлений культової шийної пластини та частини захисних елементів заради більшої мобільності користувача.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/support.rsi
  - type: CMArmor
    melee: 30 # CLOTHING_ARMOR_HIGH
  - type: RMCArmorSpeedTier
    speedTier: light
  - type: ClothingSpeedModifier # SLOWDOWN_ARMOR_LIGHT
    walkModifier: 0.725
    sprintModifier: 0.725
  - type: Storage
    grid:
    - 0,0,5,1 # 3 slots

- type: entity
  parent: RMCArmorSPPSupport
  id: RMCArmorSPPSupportSynth
  name: броня синтетиків СПН УЛ6
  description: Модифікована версія комплекту броні УЛ6, розробленою для використання синтетиками. Має відсутній захист, проте майже не сковує рухів.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/support.rsi
  - type: Clothing
    equipDelay: 1
    unequipDelay: 0.5
  - type: CMArmor
    melee: 0 # CLOTHING_ARMOR_NONE
    bullet: 0
    bio: 0
    explosionArmor: 0
  - type: RMCArmorSpeedTier
    speedTier: very light
  - type: ClothingSpeedModifier # SLOWDOWN_ARMOR_VERY_LIGHT
    walkModifier: 0.897
    sprintModifier: 0.897

- type: entity
  parent: RMCArmorSPP
  id: RMCArmorSPPCommando
  name: броня СПН зразка УМ5СУ
  description: Модифікована версія броні УМ5, розроблена для безшумних операцій.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/commando.rsi
  - type: RMCArmorSpeedTier
    speedTier: light
  - type: ClothingSpeedModifier # SLOWDOWN_ARMOR_LIGHT
    walkModifier: 0.725
    sprintModifier: 0.725
  - type: Tag
    tags:
      - RMCScoutArmor
  - type: Storage
    grid:
    - 0,0,3,1 # 2 slots

- type: entity
  parent: RMCArmorSPP
  id: RMCArmorSPPHeavy
  name: важка броня зразка УН7
  description: Надзвичайно важкий комплект броні на службі військ СПН, УН7 (Унійна Надважка Марк 7), є відомою завдяки потужному балістичному захисту, разом з виразним захистом шиї, посиленим задля можливості носіння важкого шолому.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/heavy.rsi
  - type: RMCArmorSpeedTier
    speedTier: heavy
  - type: ClothingSpeedModifier # SLOWDOWN_ARMOR_HEAVY
    walkModifier: 0.62
    sprintModifier: 0.62
  - type: CMArmor
    melee: 25 # CLOTHING_ARMOR_MEDIUMHIGH (melee)
    bullet: 35 # CLOTHING_ARMOR_HIGHPLUS (bullets)
    bio: 20 # CLOTHING_ARMOR_MEDIUM
    explosionArmor: 30 # CLOTHING_ARMOR_HIGH
  - type: Storage
    grid:
    - 0,0,5,1 # 3 slots

- type: entity
  parent: RMCArmorSPPHeavy
  id: RMCArmorSPPHeavySpecialist
  suffix: Filled, Specialist, QYJ72
  components:
  - type: IgnoreContentsSize
    items:
      tags:
      - RMCMagazineLMGQYJ72
  - type: StorageFill
    contents:
    - id: RMCMagazineLMGQYJ72
      amount: 3

- type: entity
  parent: CMArmorM3Medium
  id: RMCArmorSPPArmy
  name: броня зразка 6Б80
  description: Старий комплект броні СПН, який був замінений на стандартний комплект броні армії СПН 6Б90. Він досі використовується деякими підрозділами армії СПН третьої лінії.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/army.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/army.rsi
  - type: RMCArmorSpeedTier
    speedTier: light
  - type: ClothingSpeedModifier # SLOWDOWN_ARMOR_LIGHT
    walkModifier: 0.725
    sprintModifier: 0.725
  - type: CMArmor
    melee: 15 # CLOTHING_ARMOR_MEDIUMLOW
    bullet: 15 # CLOTHING_ARMOR_MEDIUM
    #energy: 15 # CLOTHING_ARMOR_MEDIUMLOW
    #rad: 20 # CLOTHING_ARMOR_MEDIUM
    explosionArmor: 15 # CLOTHING_ARMOR_MEDIUMLOW
    #internal: 20 # CLOTHING_ARMOR_MEDIUM
  - type: ItemCamouflage
    camouflageVariations: { }
  - type: ClothingRequireEquipped
    autoUnequip: true
    denyReason: rmc-armor-not-spp-jumpsuit
    whitelist:
      tags:
      - RMCUniformSPP

# SPP coats
- type: entity
  parent: RMCCoatBureauDeputy
  id: RMCCoatSPP
  name: офіцерська куртка СПН УЛ4
  description: Легка куртка, яка видається офіцерам збройних сил СПН. Забезпечує легкий захист, проте краще все ж носити броню.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/officer.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/officer.rsi
  - type: CMArmor
    melee: 10
    bullet: 10
    bio: 10
    explosionArmor: 10
  - type: ExplosionResistance
    damageCoefficient: 0
    worn: false
  - type: Storage
    grid:
    - 0,0,5,1 # 3 slots
  - type: FixedItemSizeStorage

- type: entity
  parent: RMCCoatBureauDeputy
  id: RMCCoatSPPSenior
  name: старша офіцерська куртка СПН УЛ4
  description: Легка куртка, яка видається старшим офіцерам збройних сил СПН. Зроблена з високоякісних матеріалів, та, на диво, має знаки розрізнення Капітана і нашивки роти на плечах і переді куртки. Забезпечує легкий захист, проте краще все ж носити броню.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/senior.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/senior.rsi
  - type: CMArmor
    melee: 10
    bullet: 10
    bio: 10
    explosionArmor: 10
  - type: Storage
    grid:
    - 0,0,7,1 # 4 slots

- type: entity
  parent: RMCCoatSPPSenior
  id: RMCCoatSPPMP
  name: камуфляжна куртка СПН УЛ4
  description: Легка куртрка, яка видається персоналу, який не бере участі у боях. Вона все ще набита до країв кевларовими вкладками, проте синтетичні нитки зменшують їх ефективність.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/mp.rsi
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/OuterClothing/SPP/mp.rsi
  - type: CMArmor
    melee: 10
    bullet: 10
    bio: 10
    explosionArmor: 10
