- type: entity
  parent: RMCArmorVestSquad
  id: RMCArmorVestSquadLeader
  name: захисний жилет лідера загону зразка М3-ЕЛ
  description: Тип захисного жилета — поглинає кулі та дозволяє легко рухатися. Ця модель була спроєктована для використання лідерами загонів КМПОН та містить окремий підсумок для стяжок. Не забезпечує захисту від вибухів, порізів і біологічних небезпек. Не для фронтового бою.
  suffix: Zipties
  components:
  - type: Storage
    grid:
    - 0,0,5,1
  - type: StorageFill
    contents:
    - id: RMCBoxZiptie
  - type: LimitedStorage
    limits:
    - popup: rmc-storage-limit-not-ziptie-box
      blacklist:
        tags:
        - RMCBoxZipties
      whitelist: null
      count: 2
