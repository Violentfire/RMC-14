- type: entity
  id: ActionXenoResinSurge
  parent: ActionXenoBase
  name: Резиновий Викид (75)
  description: "Прискорює дозрівання плодів на 5 секунд при застосуванні до фруктів. Створює тимчасові стіни при використанні на бур’янах або зміцнює існуючі стіни, надаючи їм 6000 одиниць здоров’я на 15 секунд. Якщо використати на будь-чому іншому — після короткої затримки утворюється ділянка 3×3 зі слабкої липкої смоли."
  components:
  - type: EntityWorldTargetAction
    itemIconStyle: NoItem
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: gardener_resin_surge
    event: !type:XenoResinSurgeActionEvent
    range: 7
    useDelay: 10
    checkCanAccess: false
    whitelist:
      components:
      - XenoConstruct
      - XenoFruit
      - XenoWeeds
  - type: XenoResinSurgeAction

- type: entity
  parent: ActionXenoBase
  id: ActionXenoRetrieve
  name: Виклик (180 плазми, 100 люті)
  description: З затримкою в 0,6 секунди притягує ксеноніда до вас, якщо він стоїть на місці. Великі ксеноніди не притягуються, якщо вони не повалені.
  components:
  - type: EntityTargetAction
    itemIconStyle: NoItem
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: retrieve
    event: !type:XenoRetrieveActionEvent
    range: 7
  - type: XenoActionPlasma
    cost: 180
  - type: XenoActionEnergy
    cost: 100
  - type: ActionCooldown
    cooldown: 10
  - type: ActionBlockIfResting

- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoRetrieve
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      state: retrieve

- type: entity
  parent: ActionXenoBase
  id: ActionXenoAidHeal
  name: "Лікування Ксеноїда (100 плазми, 100+ запасу здоров'я)"
  description: "Лікує обраного союзного ксеноїда. Зцілення іншого ксеноїда також зцілює й вас, а половина вашого залишкового запасу здоров’я буде витрачена для посиленого лікування. [color=red]Це не лікує охоплених вогнем ксенонідів![/color]"
  components:
  - type: EntityTargetAction
    itemIconStyle: NoItem
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: warden_heal
    event: !type:XenoAidActionEvent
    range: 1.5
    useDelay: 10
  - type: XenoActionPlasma
    cost: 100
  - type: ActionBlockIfResting
  - type: ActionSharedCooldown
    id: ActionXenoAidHeal
    ids:
    - ActionXenoAidRejuvenate
    cooldown: 10
  - type: RMCDazeableAction

- type: entity
  parent: ActionXenoBase
  id: ActionXenoAidRejuvenate
  name: "Підтримка Ксеноїда (100 плазми, 100 запасу здоров'я)"
  description: Знімає негативний стан та оглушення з віддаленого ксеноїда.
  components:
  - type: EntityTargetAction
    itemIconStyle: NoItem
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: warden_rejuvenate
    event: !type:XenoAidActionEvent
      aidType: Ailments
    range: 8
    useDelay: 10
  - type: XenoActionPlasma
    cost: 100
  - type: ActionBlockIfResting
  - type: ActionSharedCooldown
    id: ActionXenoAidRejuvenate
    ids:
    - ActionXenoAidHeal
    cooldown: 10

