  description: Пожертвуйте своїм життям, щоб зцілити сестру. [color=red]ВИ ВІДРОДИТЕСЯ ЛИШЕ, ЯКЩО ПЕРЕД ЦИМ ПЕРЕДАЛИ МАКСИМАЛЬНУ КІЛЬКІСТЬ ЗДОРОВ’Я ПІД ЧАС ЛІКУВАННЯ СЕСТЕР.[/color]
  components:
  - type: EntityTargetAction
    itemIconStyle: NoItem
    backgroundOn: null
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: screech
    event: !type:XenoSacrificeHealActionEvent
    range: 1.5

