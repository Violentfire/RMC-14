- type: entity
  parent: ActionXenoBase
  id: ActionXenoLeader
  name: Обрати/Слідкувати за Лідерами
  description: Обрати або відібрати лідерство у ксеноїдів, а також дозволяє спостерігати за ними. Підвищення ксеноїда до лідера змусить його випромінювати ваші феромони навколо себе.
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    backgroundOn: null
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: xeno_lead
    event: !type:HiveLeaderActionEvent
    useDelay: 3

- type: entity
  parent: CMGuidebookActionXenoBase
  id: RMCGuidebookActionXenoLeader
  name: Обрати Лідера
  description: Обрати або відібрати лідерство у ксеноїдів. Підвищення ксеноїда до лідера змусить його випромінювати ваші феромони навколо себе.
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      state: xeno_lead

- type: entity
  parent: ActionXenoBase
  id: ActionXenoHeal
  name: Лікування Ксеноїдів (600) # TODO RMC14 proper plasma costs
  description: "Лікує ксеноїдів у радіусі 4 плиток від обраної точки, відновлюючи 30% їхнього здоров’я протягом 20 секунд."
  components:
  - type: WorldTargetAction
    itemIconStyle: NoItem
    backgroundOn: null
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: heal_xeno
    event: !type:XenoHealActionEvent
    useDelay: 8
    checkCanAccess: false
    range: -1
  - type: XenoActionPlasma
    cost: 600

- type: entity
  parent: ActionXenoBase
  id: ActionXenoApplySalve
  name: Нанести Слиз (200)
  description: "Наносить смолу, використовуючи частину вашого здоров’я для лікування союзних ксеноїдів до 100 одиниць здоров’я за 5 секунд. Можна наносити одночасно смолу на кілька ксеноїдів."
  components:
  - type: EntityTargetAction
    itemIconStyle: NoItem
    backgroundOn: null
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: apply_salve
    event: !type:XenoApplySalveActionEvent
    useDelay: 0.5
    range: 2
  - type: RMCDazeableAction

