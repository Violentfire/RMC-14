- type: job
  parent: CMJobBase
  id: SichCLFEngineer
  name: rmc-clf-engineer
  description: rmc-ghost-role-information-clf-description
  playTimeTracker: RMCJobCLFEngineer
  ranks:
    RMCRankCLFRebel: [ ]
  startingGear: SichGearCLFEngineer
  icon: RMCJobIconCLFEngineer
  joinNotifyCrew: false
  spawnMenuRoleName: CLF Engineer
  special:
  - !type:AddComponentSpecial
    components:
    - type: Skills
      skills:
        RMCSkillFirearms: 1
        RMCSkillFireman: 1
        RMCSkillMeleeWeapons: 1
        RMCSkillPolice: 1
        RMCSkillEndurance: 1
        RMCSkillJtac: 1
        RMCSkillVehicles: 1
        RMCSkillMedical: 1

        RMCSkillConstruction: 2
        RMCSkillEngineer: 2
        RMCSkillPowerLoader: 2
    - type: NpcFactionMember
      factions:
      - CLF
    - type: JobPrefix
      prefix: rmc-job-prefix-clf-engineer
  hidden: true

- type: entity
  id: SichRandomHumanoidCLFEngineer
  name: clf ghost role engineer
  suffix: Spawner, Player
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Accessory/Armbands/clf_armband.rsi
    state: icon
  - type: RandomHumanoidSpawner
    settings: RMCCLFEngineer

- type: randomHumanoidSettings
  parent: RMCEventHumanoid
  id: SichCLFEngineer
  components:
  - type: GhostRole
    name: rmc-ghost-role-clf-engineer
    description: rmc-ghost-role-information-clf-description
    rules: rmc-ghost-role-information-clf-rules
    reregister: false
    job: RMCCLFEngineer
    raffle:
      settings: short
    requirements:
    - !type:RoleTimeRequirement
      role: CMJobCombatTech
      time: 18000 # 5 Hours
  - type: GhostRoleApplySpecial
    squad: SquadCLF

- type: startingGear
  id: SichGearCLFEngineer
  equipment:
    head: RMCHelmetWelding
    mask: RMCCombatUtilityKnifeA
    ears: RMCHeadsetDistressCLF
  #  eyes: RMCMesonGoggles TODO RMC14
    jumpsuit: RMCJumpsuitCLFWebbingBuckshot
    outerClothing: RMCCoatMilitiaHauberk
    gloves: CMHandsInsulated
    shoes: RMCShoesBrown
    id: RMCIDCardCLFEngineer
    belt: CMBeltUtilityFilled
    back: RMCSatchelLightpackWelder
    pocket1: RMCPouchConstructionFillLowGrade
    pocket2: RMCPouchFirstAidERTFill
  inhand:
  - WeaponShotgunM357Sawn # TODO RMC14 - Make randomized
  - CMShellShotgunBuckshot # TODO RMC14 - Make randomized
  storage:
    back:
    - RMCExplosiveBreachingCharge
    - RMCExplosiveBreachingCharge
    - RMCExplosiveBreachingCharge
    - RMCExplosivePlastic
    - RMCGrenadeMolotov
    - RMCMRECLF
    - RMCFlashlight
    - CMShellShotgunBuckshot
    - CMShellShotgunBuckshot
    outerClothing:
    - CMShellShotgunBuckshot
    - CMShellShotgunBuckshot
